[project]
name = "police-operations-log-data-analysis"
version = "0.1.0"
description = "Personal data analysis dashboard with customer-specific connectors"
readme = "README.md"
authors = [
    { name = "Zeyadalofie", email = "zeyad3537@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "cryptography>=44,<47",
    "authlib>=1.5,<2",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "boto3>=1.37,<2",
    "pandas>=2.2,<4",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
